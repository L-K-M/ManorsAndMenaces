[package]
name = "manors-menaces"
version = "0.1.0"
description = "Manors & Menaces — a competitive fantasy strategy board game"
authors = ["L-K-M"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "manors_menaces_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
