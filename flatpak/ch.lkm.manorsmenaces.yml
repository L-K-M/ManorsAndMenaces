# Flatpak manifest. scripts/build-flatpak.sh extracts the release .deb into
# dist/flatpak/stage and builds from that — the bundle ships the same files
# the .deb installs, relaid under flatpak's /app prefix.
id: ch.lkm.manorsmenaces
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: manors-menaces
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # WebKit's GPU rendering.
  - --device=dri
modules:
  - name: manors-menaces
    buildsystem: simple
    sources:
      - type: dir
        path: ../dist/flatpak/stage
    build-commands:
      - cp -R . /app/
