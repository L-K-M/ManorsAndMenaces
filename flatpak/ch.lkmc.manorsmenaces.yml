# Flatpak manifest. scripts/build-flatpak.sh extracts the release .deb into
# dist/flatpak/stage and builds from that — the bundle ships the same files
# the .deb installs, relaid under flatpak's /app prefix.
id: ch.lkmc.manorsmenaces
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: manors-menaces
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # WebKitGTK HTML5/WebAudio (apps/web/src/lib/audio: sfx + soundscape).
  - --socket=pulseaudio
  # WebKit's GPU rendering.
  - --device=dri
modules:
  - name: manors-menaces
    buildsystem: simple
    sources:
      - type: dir
        path: ../dist/flatpak/stage
    build-commands:
      - rm -rf DEBIAN
      - "if [ -d usr ]; then cp -a usr/. /app/; else cp -a . /app/; fi"
