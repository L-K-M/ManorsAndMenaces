# Self-hosted online server. Every tunable is ${VAR:-default}; set them in
# .env next to this file (start from .env.example, which explains each).
services:
  manors:
    build: .
    image: ${IMAGE:-ghcr.io/l-k-m/manorsandmenaces:latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787" # host port, or address:port, for the web client + API
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-*} # keep * for the desktop and Android apps
      AI_DELAY_MS: ${AI_DELAY_MS:-700} # pause between server-side AI moves
      # Behind a reverse proxy (nginx, Caddy, Traefik) every player arrives from
      # the proxy's address and shares one rate limit. Set this to the number of
      # proxies in front of the server so limits key on the X-Forwarded-For
      # client address instead. Leave it at 0 when the port is exposed directly:
      # clients could then forge the header. Each proxy must append to or
      # overwrite X-Forwarded-For (it is read before Forwarded), never pass a
      # client-supplied one through untouched.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Your contact for Web Push services (turn notices to players whose app
      # is closed): you@example.org or an https: URL of yours. Empty means the
      # project's repository.
      PUSH_CONTACT: ${PUSH_CONTACT:-}
      # How often the Android app's background connection is pinged, in
      # seconds. Each ping wakes the phone; lower it only if a proxy in front
      # closes idle WebSockets sooner (Cloudflare Free/Pro: 100 s, so 90).
      BACKGROUND_PING_SECONDS: ${BACKGROUND_PING_SECONDS:-600}
      # Turn emails, for players who confirm an address in the lobby: set
      # SMTP_HOST, MAIL_FROM and PUBLIC_URL; leave SMTP_HOST empty to keep
      # email off. See docs/notifications.md.
      SMTP_HOST: ${SMTP_HOST:-} # smtp.example.org
      SMTP_PORT: ${SMTP_PORT:-} # default 587 (STARTTLS); 465 connects with TLS
      SMTP_USER: ${SMTP_USER:-} # the login, exactly as your provider gives it
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Replaced by PUSH_CONTACT and the SMTP_ settings above. Passed on only
      # so that the server stops and names the replacement if an older .env
      # still sets one, instead of quietly running without them.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-} # Manors & Menaces <turns@example.org>
      PUBLIC_URL: ${PUBLIC_URL:-} # https://play.example.org, where players open the game
      # Open the game only to people with a personal invite. Make invites with
      # `docker compose exec manors node server.mjs invites create NAME`; see
      # docs/invites.md.
      INVITE_ONLY: ${INVITE_ONLY:-false}
      # Give invites to the winners of a game on your website: the sponsor
      # invite's id and the one website allowed to call. Needs INVITE_ONLY and
      # PUBLIC_URL; see docs/invites.md.
      GIVEAWAY_INVITE: ${GIVEAWAY_INVITE:-}
      GIVEAWAY_ORIGIN: ${GIVEAWAY_ORIGIN:-} # https://apps.example.org
      GIVEAWAY_KEY: ${GIVEAWAY_KEY:-} # a puzzle key every claim must carry; empty: none
    volumes:
      - manors-data:/data # SQLite database
volumes:
  manors-data:
