name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    # A tag on a broken commit must not publish.
    name: Gate on the test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # LICENSE is the Unlicense. Manifests, package metadata and the README
      # must not claim another license for the project's own code.
      - name: License statements agree with LICENSE
        run: |
          grep -q 'unlicense.org' LICENSE
          grep -qx 'license = "Unlicense"' src-tauri/Cargo.toml
          node -e '
            for (const file of process.argv.slice(1)) {
              const json = JSON.parse(require("fs").readFileSync(file, "utf8"));
              const license = file.endsWith("tauri.conf.json") ? json.bundle?.license : json.license;
              if (license !== "Unlicense") {
                console.error(`${file}: license is ${license}, but LICENSE is the Unlicense`);
                process.exitCode = 1;
              }
            }' package.json apps/web/package.json apps/server/package.json src-tauri/tauri.conf.json
          sed -n '/^## License/,/^## /p' README.md | grep -q '\[Unlicense\](LICENSE)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm map:check
      - run: pnpm build:check
      - run: pnpm --filter @manors-menaces/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  web:
    name: Web build (static hosting)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manors-menaces/web build
      - run: pnpm --filter @manors-menaces/server build
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd apps/web/dist && zip -qr "$GITHUB_WORKSPACE/manors-menaces-web-$VERSION.zip" .)
          cp apps/server/dist/server.mjs "manors-menaces-server-$VERSION.mjs"
          cp apps/server/dist/Third-Party-Notices.txt "manors-menaces-server-$VERSION-Third-Party-Notices.txt"
      # The notices must be in what users download: the zip's root, and the
      # file published next to the server bundle.
      - name: Check third-party notices
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          unzip -p "manors-menaces-web-$VERSION.zip" Third-Party-Notices.txt | grep -q '^svelte '
          unzip -p "manors-menaces-web-$VERSION.zip" Third-Party-Notices.txt | grep -q 'SIL Open Font License'
          unzip -l "manors-menaces-web-$VERSION.zip" | grep -q ' LICENSE.txt$'
          grep -q '^ws ' "manors-menaces-server-$VERSION-Third-Party-Notices.txt"
          grep -q '^nodemailer ' "manors-menaces-server-$VERSION-Third-Party-Notices.txt"
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            manors-menaces-web-*.zip
            manors-menaces-server-*.mjs
            manors-menaces-server-*-Third-Party-Notices.txt

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: macOS
            os: macos-14
            args: "--target universal-apple-darwin"
          - name: Windows
            os: windows-2022
            # NSIS, not WiX/msi: the WiX 3 candle.exe bundled by Tauri fails
            # on the current windows-2022 runner image (v0.1.0 release run);
            # Tauri recommends NSIS installers on Windows.
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # squashfs-tools and libarchive-tools: AppImage notices and the package checks below.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            squashfs-tools libarchive-tools
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          args: ${{ matrix.args }}
      # The AppImage bundles this runner's GTK/WebKitGTK libraries. Add their
      # copyright files, license texts and exact source packages, and the
      # AppImage runtime's, before anything uploads it.
      - name: AppImage system library notices
        if: runner.os == 'Linux'
        run: |
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            python3 scripts/appimage-notices.py appimage "$appimage" --package manors-menaces \
              --overrides licenses/appimage-notices.json --report "$RUNNER_TEMP/appimage-notices.json"
          done
      # Third-party notices (scripts/tauri-notices.mjs) inside what users download.
      - name: Check third-party notices in the Linux packages
        if: runner.os == 'Linux'
        run: |
          bundle=src-tauri/target/release/bundle
          doc=usr/share/doc/manors-menaces
          dpkg-deb -x $bundle/deb/*.deb "$RUNNER_TEMP/deb"
          mkdir "$RUNNER_TEMP/rpm" && bsdtar -xf $bundle/rpm/*.rpm -C "$RUNNER_TEMP/rpm"
          appimage=$(realpath $bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          for root in deb rpm squashfs-root; do
            test -s "$RUNNER_TEMP/$root/$doc/Rust-Licenses.html"
            grep -q '^tauri ' "$RUNNER_TEMP/$root/$doc/Third-Party-Notices.txt"
            grep -q '^svelte ' "$RUNNER_TEMP/$root/$doc/Third-Party-Notices.txt"
          done
          grep -q '^License: Unlicense' "$RUNNER_TEMP/deb/$doc/copyright"
          grep -q '^License: Unlicense' "$RUNNER_TEMP/squashfs-root/$doc/copyright"
          test -s "$RUNNER_TEMP/rpm/$doc/LICENSE"
          grep -q 'type2-runtime' "$RUNNER_TEMP/squashfs-root/$doc/Third-Party-Notices.txt"
          test -s "$RUNNER_TEMP/squashfs-root/$doc/SOURCES.txt"
          test -s "$RUNNER_TEMP/squashfs-root/usr/share/doc/libglib2.0-0/copyright"
      - name: Check third-party notices in the macOS app
        if: runner.os == 'macOS'
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          resources="$bundle/macos/Manors & Menaces.app/Contents/Resources"
          for f in Third-Party-Notices.txt Rust-Licenses.html LICENSE.txt; do test -s "$resources/$f"; done
          grep -q '^objc2 ' "$resources/Third-Party-Notices.txt"
          grep -q '^svelte ' "$resources/Third-Party-Notices.txt"
          # The disk image is what users download.
          yes | hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" $bundle/dmg/*.dmg >/dev/null
          test -s "$RUNNER_TEMP/dmg/Manors & Menaces.app/Contents/Resources/Third-Party-Notices.txt"
          hdiutil detach "$RUNNER_TEMP/dmg"
      # tauri-build stages bundle.resources (tauri.windows.conf.json) here for the installer.
      - name: Check third-party notices for the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for f in Third-Party-Notices.txt Rust-Licenses.html LICENSE.txt; do test -s "src-tauri/target/release/$f"; done
          grep -q '^webview2-com ' src-tauri/target/release/Third-Party-Notices.txt
          grep -q '^svelte ' src-tauri/target/release/Third-Party-Notices.txt
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe

  flatpak:
    name: Linux Flatpak
    needs: test
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            flatpak flatpak-builder elfutils
          # Ubuntu 24.04 denies the unprivileged user namespaces bubblewrap
          # (flatpak's sandbox helper) builds in.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true   # absent on kernels without the knob
      - run: pnpm install --frozen-lockfile
      - name: Build Linux .deb
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          args: --bundles deb
      - name: Repack, checksum and attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-flatpak.sh src-tauri/target/release/bundle/deb/*.deb
          for f in dist/*.flatpak; do
            (cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.flatpak dist/*.flatpak.sha256 --clobber

  android:
    name: Android (unsigned APK)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: NDK
        run: sdkmanager "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: pnpm tauri android build --apk --ci
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk "manors-menaces-$VERSION-android-unsigned.apk"
      # Notices of the Android libraries (res/raw/aboutlibraries.json) and of
      # the Rust library and web frontend (assets/licenses/) in the published
      # APK; scan reads the libraries from this job's Gradle cache and fetches
      # any it lacks from the repositories the build uses.
      - name: Check third-party notices in the APK
        run: |
          apk="manors-menaces-${GITHUB_REF_NAME#v}-android-unsigned.apk"
          python3 -I scripts/android_notices.py check "$apk" --config src-tauri/gen/android/android-notices.toml
          python3 -I scripts/android_notices.py scan "$apk" --config src-tauri/gen/android/android-notices.toml \
            --fetch-from https://dl.google.com/dl/android/maven2 --fetch-from https://repo.maven.apache.org/maven2
          unzip -p "$apk" assets/licenses/Third-Party-Notices.txt | grep -q '^tauri '
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: manors-menaces-*-android-unsigned.apk

  image:
    name: Server container image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action would label the image with the repository's license
      # alone; the Dockerfile's label also names the bundled code's licenses.
      - name: Image license label
        id: oci
        run: echo "licenses=$(sed -n 's/^LABEL org.opencontainers.image.licenses="\(.*\)"$/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=${{ steps.oci.outputs.licenses }}
      - uses: docker/setup-buildx-action@v4
      - name: Build the image for checks
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: manors-menaces:check
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # The image must carry the notices of the bundled server and web code,
      # and its license label must name every license they list.
      - name: Check third-party notices in the image
        run: |
          image=manors-menaces:check
          doc=/usr/share/doc/manors-menaces
          docker run --rm --entrypoint sh "$image" -c \
            "test -s $doc/Third-Party-Notices.txt && test -s $doc/LICENSE && test -s /app/web/Third-Party-Notices.txt && test -s /app/web/LICENSE.txt"
          notices=$(docker run --rm --entrypoint cat "$image" "$doc/Third-Party-Notices.txt")
          for entry in ws nodemailer svelte @fontsource/alegreya; do grep -q "^$entry " <<<"$notices"; done
          label=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$image")
          for term in Unlicense $(sed -n 's/^License: //p' <<<"$notices" | tr -s ' ()' '\n' | grep -vx 'AND\|OR\|WITH' | sort -u); do
            tr ' ' '\n' <<<"$label" | grep -qx -- "$term" || { echo "image label '$label' does not name $term"; exit 1; }
          done
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
