name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Cancel superseded PR runs, but never an in-progress main run (a permanently
# "cancelled" main commit hides breakage and breaks CI bisection).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, unit + integration tests
    runs-on: ubuntu-24.04
    # A wedged build must not burn 6 h of runner time.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Contributors get pnpm through the corepack bundled with the .nvmrc
      # Node (README, AGENTS.md); corepack older than 0.31 rejects npm's
      # current signing key, which the pnpm action above would hide.
      - name: Bundled corepack provides the pinned pnpm
        run: |
          pinned=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
          test "$(corepack pnpm --version)" = "$pinned"
      # LICENSE is the Unlicense. Manifests, package metadata and the README
      # must not claim another license for the project's own code.
      - name: License statements agree with LICENSE
        run: |
          grep -q 'unlicense.org' LICENSE
          grep -qx 'license = "Unlicense"' src-tauri/Cargo.toml
          node -e '
            for (const file of process.argv.slice(1)) {
              const json = JSON.parse(require("fs").readFileSync(file, "utf8"));
              const license = file.endsWith("tauri.conf.json") ? json.bundle?.license : json.license;
              if (license !== "Unlicense") {
                console.error(`${file}: license is ${license}, but LICENSE is the Unlicense`);
                process.exitCode = 1;
              }
            }' package.json apps/web/package.json apps/server/package.json src-tauri/tauri.conf.json
          sed -n '/^## License/,/^## /p' README.md | grep -q '\[Unlicense\](LICENSE)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Committed map matches the generator and validates
        run: pnpm map:check
      - name: Production web and server builds, server smoke test
        run: pnpm build:check

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manors-menaces/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  tauri-check:
    name: Tauri shell compiles (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontend for tauri::generate_context!
        run: mkdir -p apps/web/dist && echo '<!doctype html>' > apps/web/dist/index.html
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  tauri-notices:
    name: Third-party notices of the Tauri apps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # Every crate linked into a shipped target needs its license text
      # (licenses/rust-overrides.json fills the gaps), and the app's own
      # crate must declare the Unlicense. Reads metadata only; builds nothing.
      - name: Rust crate notices for every shipped target
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc \
              aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            python3 scripts/rust-notices.py --manifest-path src-tauri/Cargo.toml --target "$target" \
              --overrides licenses/rust-overrides.json --own-license Unlicense --check
          done
      # What tauri.conf.json's beforeBuildCommand writes for a Linux build:
      # the files the packages install and the binary embeds.
      - name: Notices of a Linux build
        run: |
          pnpm --filter @manors-menaces/web build
          TAURI_ENV_PLATFORM=linux TAURI_ENV_TARGET_TRIPLE=x86_64-unknown-linux-gnu node scripts/tauri-notices.mjs
          for f in Third-Party-Notices.txt Rust-Licenses.html copyright; do test -s "src-tauri/licenses/$f"; done
          for f in Third-Party-Notices.txt Rust-Licenses.html; do cmp "src-tauri/licenses/$f" "apps/web/dist/$f"; done
          grep -q '^tauri ' src-tauri/licenses/Third-Party-Notices.txt
          grep -q '^svelte ' src-tauri/licenses/Third-Party-Notices.txt
          grep -q 'SIL Open Font License' src-tauri/licenses/Third-Party-Notices.txt
          grep -q 'Copyright notices for The Rust Standard Library' src-tauri/licenses/Rust-Licenses.html
          python3 scripts/deb-copyright.py check src-tauri/licenses/copyright --no-common-licenses
