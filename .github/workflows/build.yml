name: Build

# On-demand installer builds without cutting a release: macOS (.dmg/.app,
# universal), Linux (.deb + .AppImage) and Android (unsigned APK). Results are
# attached to the run as artifacts. Start it from the Actions tab or with
# `gh workflow run build.yml`.

on:
  workflow_dispatch:

# Least privilege: builds only read the repository.
permissions:
  contents: read

# Never cancel an in-progress build of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            args: "--target universal-apple-darwin --bundles app,dmg"
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: manors-menaces-macos
            files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
            rust-targets: ""
            artifact: manors-menaces-linux
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # squashfs-tools: AppImage notices below.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf squashfs-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }} --ci
      # The AppImage bundles this runner's GTK/WebKitGTK libraries: add their
      # copyright files, license texts and exact source packages, and the
      # AppImage runtime's (as release.yml does).
      - name: AppImage system library notices
        if: runner.os == 'Linux'
        run: |
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            python3 scripts/appimage-notices.py appimage "$appimage" --package manors-menaces \
              --overrides licenses/appimage-notices.json --report "$RUNNER_TEMP/appimage-notices.json"
          done
      # Third-party notices (scripts/tauri-notices.mjs) inside the artifacts.
      - name: Check third-party notices in the Linux packages
        if: runner.os == 'Linux'
        run: |
          bundle=src-tauri/target/release/bundle
          doc=usr/share/doc/manors-menaces
          dpkg-deb -x $bundle/deb/*.deb "$RUNNER_TEMP/deb"
          appimage=$(realpath $bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
          for root in deb squashfs-root; do
            test -s "$RUNNER_TEMP/$root/$doc/Rust-Licenses.html"
            grep -q '^License: Unlicense' "$RUNNER_TEMP/$root/$doc/copyright"
            grep -q '^tauri ' "$RUNNER_TEMP/$root/$doc/Third-Party-Notices.txt"
            grep -q '^svelte ' "$RUNNER_TEMP/$root/$doc/Third-Party-Notices.txt"
          done
          grep -q 'type2-runtime' "$RUNNER_TEMP/squashfs-root/$doc/Third-Party-Notices.txt"
          test -s "$RUNNER_TEMP/squashfs-root/$doc/SOURCES.txt"
          test -s "$RUNNER_TEMP/squashfs-root/usr/share/doc/libglib2.0-0/copyright"
      - name: Check third-party notices in the macOS app
        if: runner.os == 'macOS'
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          resources="$bundle/macos/Manors & Menaces.app/Contents/Resources"
          for f in Third-Party-Notices.txt Rust-Licenses.html LICENSE.txt; do test -s "$resources/$f"; done
          grep -q '^objc2 ' "$resources/Third-Party-Notices.txt"
          grep -q '^svelte ' "$resources/Third-Party-Notices.txt"
          yes | hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" $bundle/dmg/*.dmg >/dev/null
          test -s "$RUNNER_TEMP/dmg/Manors & Menaces.app/Contents/Resources/Third-Party-Notices.txt"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (unsigned APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: NDK
        run: sdkmanager "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: pnpm tauri android build --apk --ci
      # The turn watcher's JVM unit tests (app/src/test); they need the Gradle
      # files the build above generates, but not the Rust library. The ABI
      # flavors share their sources, so one flavor's run covers them.
      - name: Unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew --no-daemon :app:testUniversalDebugUnitTest
      # Notices of the Android libraries (res/raw/aboutlibraries.json) and of
      # the Rust library and web frontend (assets/licenses/) in the APK; scan
      # reads the libraries from this job's Gradle cache and fetches any it
      # lacks from the repositories the build uses.
      - name: Check third-party notices in the APK
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          python3 -I scripts/android_notices.py check "$apk" --config src-tauri/gen/android/android-notices.toml
          python3 -I scripts/android_notices.py scan "$apk" --config src-tauri/gen/android/android-notices.toml \
            --fetch-from https://dl.google.com/dl/android/maven2 --fetch-from https://repo.maven.apache.org/maven2
          unzip -p "$apk" assets/licenses/Third-Party-Notices.txt | grep -q '^tauri '
      - uses: actions/upload-artifact@v7
        with:
          name: manors-menaces-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 14
